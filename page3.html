                        { speaker: "櫃檯", text: "請問您是否有指定醫師？或是由我們為您安排值班醫師？" },
                        { speaker: "病患", text: "請幫我安排最快能看診的醫師即可，另外我有藥物過敏史。" },
                        { speaker: "櫃檯", text: "了解，請出示健保卡，並稍候為您測量體溫與血壓。" }
                    ],
                    visual_tags: ["健保卡 (Health Card)", "口罩 (Mask)", "掛號單 (Form)"],
                    culture_note: "台灣的健保制度非常方便，就醫時務必攜帶健保卡 (NHI Card)。"
                },
                'default': {
                    easy: [
                        { speaker: "A", text: `請問${scenarioTitle}怎麼做？` },
                        { speaker: "B", text: `你可以先去櫃檯問問看。` },
                        { speaker: "A", text: `好的，謝謝你的幫忙。` },
                        { speaker: "B", text: `不客氣，祝你順利。` }
                    ],
                    hard: [
                        { speaker: "A", text: `關於${scenarioTitle}的流程，似乎比想像中繁瑣。` },
                        { speaker: "B", text: `確實，建議您先備妥相關文件，以提升辦理效率。` },
                        { speaker: "A", text: `這建議非常中肯，我會特別留意的。` },
                        { speaker: "B", text: `若有任何疑慮，隨時可以向相關人員諮詢。` }
                    ],
                    visual_tags: ["櫃檯 (Counter)", "文件 (Document)", "服務人員 (Staff)"],
                    culture_note: `在${scenarioTitle}時，保持耐心與禮貌是溝通順暢的關鍵。`
                }
            };

            const data = scriptData[scenarioTitle] || scriptData['default'];
            return {
                script: isEasy ? data.easy : data.hard,
                visual_tags: data.visual_tags,
                culture_note: data.culture_note
            };
        };

        // --- 3. API & Logic Helpers ---

        const getLevelDesc = (level) => {
            const map = {
                'A1': '句長：短句 (5-10字) | 詞彙：超高頻詞 | 語法：SVO', 'A2': '句長：生活常用句 | 詞彙：具體名詞',
                'B1': '句長：中長句 | 詞彙：抽象名詞', 'B2': '句長：段落結構 | 語法：複句',
                'C1': '句長：結構複雜 | 語法：倒裝/修辭', 'C6': '句長：母語水準 | 語法：文化隱喻'
            };
            return map[level] || map['B1'];
        };

        const callGeminiAPI = async (apiKey, prompt, systemInstruction = "", jsonMode = false) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: { temperature: 0.7, maxOutputTokens: 2000, ...(jsonMode && { responseMimeType: "application/json" }) }
            };
            const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            if (!response.ok) throw new Error(`API Error: ${response.status}`);
            const data = await response.json();
            const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) throw new Error("No content generated");
            return jsonMode ? JSON.parse(text) : text;
        };

        // --- 4. Components ---

        const Button = ({ children, onClick, variant = 'primary', className = '', disabled = false, size = 'md' }) => {
            const base = "font-medium transition-all duration-200 flex items-center justify-center gap-2 shadow-sm active:scale-95 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100";
            const sizes = { sm: "px-3 py-1.5 text-sm", md: "px-4 py-2", lg: "px-6 py-3 text-lg" };
            const variants = {
                primary: "bg-[#006699] text-white hover:bg-[#005580]",
                secondary: "bg-[#FFB347] text-gray-900 hover:bg-[#ffa524]",
                outline: "border border-[#006699] text-[#006699] hover:bg-blue-50",
                ghost: "text-gray-600 hover:bg-gray-100",
                dark: "bg-gray-800 text-gray-200 hover:bg-gray-900",
                trial: "bg-emerald-600 text-white hover:bg-emerald-700"
            };
            return <button onClick={onClick} disabled={disabled} className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}>{children}</button>;
        };

        const Card = ({ children, title, icon: Icon, className = '', headerAction, noPadding = false }) => (
            <div className={`bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden flex flex-col ${className}`}>
                {(title || Icon) && (
                    <div className="bg-gray-50 px-4 py-3 border-b border-gray-100 flex items-center justify-between">
                        <div className="flex items-center gap-2">
                            {Icon && <span className="text-[#FFB347]"><Icon size={20}/></span>}
                            <h3 className="font-bold text-gray-800">{title}</h3>
                        </div>
                        {headerAction}
                    </div>
                )}
                <div className={`${noPadding ? '' : 'p-4'} flex-1 overflow-auto`}>{children}</div>
            </div>
        );

        // --- 5. Mode Selection Modal ---
        const ModeSelectionModal = ({ isOpen, onClose, onSelectMode, currentKey }) => {
            const [step, setStep] = useState(currentKey ? 'api' : 'select');
            const [inputKey, setInputKey] = useState(currentKey || '');
            const [showPassword, setShowPassword] = useState(false);

            useEffect(() => { 
                if (isOpen && currentKey) setStep('api'); 
                else if (isOpen) setStep('select');
                setInputKey(currentKey || '');
            }, [isOpen, currentKey]);

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm animate-fade-in p-4">
                    <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-gray-100">
                        <div className="bg-[#006699] px-6 py-4 flex justify-between items-center text-white">
                            <h3 className="text-xl font-bold flex items-center gap-2"><Settings size={20}/> 平台設定</h3>
                            <button onClick={onClose} className="hover:bg-white/20 p-1 rounded-full"><X size={20}/></button>
                        </div>
                        <div className="p-6">
                            {step === 'select' ? (
                                <div className="space-y-4">
                                    <p className="text-gray-600 text-center mb-6">請選擇您要使用的模式：</p>
                                    <button onClick={() => onSelectMode('trial', '')} className="w-full p-4 rounded-xl border-2 border-emerald-100 hover:border-emerald-500 bg-emerald-50/50 hover:bg-emerald-50 transition-all group flex items-center gap-4 text-left">
                                        <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center group-hover:scale-110 transition-transform"><Rocket size={24}/></div>
                                        <div><div className="font-bold text-gray-800 text-lg">體驗版 (Trial)</div><div className="text-xs text-gray-500">免 Key • 高擬真模擬引擎 • 快速體驗</div></div>
                                    </button>
                                    <button onClick={() => setStep('api')} className="w-full p-4 rounded-xl border-2 border-blue-100 hover:border-[#006699] bg-blue-50/50 hover:bg-blue-50 transition-all group flex items-center gap-4 text-left">
                                        <div className="w-12 h-12 rounded-full bg-blue-100 text-[#006699] flex items-center justify-center group-hover:scale-110 transition-transform"><Gem size={24}/></div>
                                        <div><div className="font-bold text-gray-800 text-lg">正式版 (Full)</div><div className="text-xs text-gray-500">需 Key • Gemini 2.5 Flash 真實 AI</div></div>
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <div className="flex items-center gap-2 text-[#006699] mb-2 cursor-pointer hover:underline" onClick={() => setStep('select')}><ArrowRight size={14} className="rotate-180"/> 返回選擇</div>
                                    <p className="text-sm text-gray-500">請輸入 Google Gemini API Key。Key 僅儲存於本地瀏覽器。</p>
                                    <div className="relative">
                                        <input type={showPassword ? "text" : "password"} value={inputKey} onChange={(e) => setInputKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-3 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#006699] font-mono text-sm"/>
                                        <button onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-3 text-gray-400 hover:text-gray-600">{showPassword ? <ArrowRight size={16} className="rotate-180"/> : <ArrowRight size={16}/>}</button>
                                    </div>
                                    <div className="mt-2 text-xs text-gray-400 flex justify-between"><a href="https://aistudio.google.com/app/apikey" target="_blank" className="underline hover:text-[#006699]">取得 API Key</a></div>
                                    <Button onClick={() => onSelectMode('full', inputKey)} className="w-full mt-4">確認並啟用 AI</Button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 6. Main App Component ---
        function HuaYuAIApp() {
            // App State
            const [appMode, setAppMode] = useState('trial'); 
            const [apiKey, setApiKey] = useState('');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('generate');
            const [selectedTheme, setSelectedTheme] = useState(THEMES[0]);
            const [selectedScenario, setSelectedScenario] = useState(THEMES[0].scenarios[0]);
            
            // Feature State
            const [genLevel, setGenLevel] = useState('B1');
            const [genPattern, setGenPattern] = useState('narrative');
            const [genResult, setGenResult] = useState(null);
            const [isGenerating, setIsGenerating] = useState(false);

            const [rewriteInput, setRewriteInput] = useState('');
            const [rewriteMode, setRewriteMode] = useState('formal');
            const [rewriteResult, setRewriteResult] = useState(null);
            const [isRewriting, setIsRewriting] = useState(false);

            // QA State
            const [qaMessages, setQaMessages] = useState([]);
            const [qaInput, setQaInput] = useState('');
            const [isQAing, setIsQAing] = useState(false);
            
            // Assistant State
            const [selectedAssistant, setSelectedAssistant] = useState(ASSISTANTS[0]);
            const [chatMessages, setChatMessages] = useState([]);
            const [chatInput, setChatInput] = useState('');
            const [isChatting, setIsChatting] = useState(false);

            // Multimodal State
            const [mmScenario, setMmScenario] = useState(MM_SCENARIOS[0]);
            const [mmData, setMmData] = useState(null);
            const [isMmGen, setIsMmGen] = useState(false);

            // Common
            const [playingId, setPlayingId] = useState(null);
            const [showPromptDebug, setShowPromptDebug] = useState(false);
            const [lastPrompt, setLastPrompt] = useState({ system: "", user: "" });

            // Init
            useEffect(() => {
                const storedKey = localStorage.getItem('hua_yu_api_key');
                const storedMode = localStorage.getItem('hua_yu_app_mode');
                if (storedKey) { setApiKey(storedKey); setAppMode('full'); }
                else if (storedMode === 'trial') { setAppMode('trial'); }
                else { setTimeout(() => setIsSettingsOpen(true), 500); }
            }, []);

            const handleModeSelect = (mode, key) => {
                setAppMode(mode);
                localStorage.setItem('hua_yu_app_mode', mode);
                if (mode === 'full' && key) { setApiKey(key); localStorage.setItem('hua_yu_api_key', key); }
                setIsSettingsOpen(false);
            };

            // Reset Contexts
            useEffect(() => {
                setQaMessages([{ role: 'ai', type: 'text', text: `你好！我是你的華語問答助手。針對【${selectedTheme.name} - ${selectedScenario}】，有什麼想問的嗎？` }]);
            }, [selectedTheme, selectedScenario]);

            useEffect(() => {
                setChatMessages([{ role: 'ai', text: selectedAssistant.greeting }]);
            }, [selectedAssistant]);

            // --- Handlers ---

            const handleGenerate = async () => {
                setIsGenerating(true); setGenResult(null);
                try {
                    if (appMode === 'trial') {
                        // Simulate latency
                        await new Promise(r => setTimeout(r, 800));
                        // Call restored Mock Engine
                        const res = generateMockContent(selectedTheme.name, selectedScenario, genLevel, genPattern);
                        setGenResult(res);
                        setRewriteInput(res.content[0].text);
                    } else {
                        // Real API Logic
                        const patternObj = PATTERNS.find(p => p.id === genPattern);
                        const levelDesc = getLevelDesc(genLevel);
                        const sys = `資深華語教師。輸出JSON: { "content": [{ "type": "...", "text": "...", "pinyin": "...", "grammar_point": "..." }], "stats": { "estimated_level": "...", "key_vocabulary": [] } }`;
                        const usr = `主題:${selectedTheme.name}, 情境:${selectedScenario}, 等級:${genLevel}, 句型:${patternObj.name}`;
                        const apiRes = await callGeminiAPI(apiKey, usr, sys, true);
                        setGenResult(apiRes);
                        if(apiRes.content?.[0]) setRewriteInput(apiRes.content[0].text);
                    }
                } catch(e) { console.error(e); } finally { setIsGenerating(false); }
            };

            const handleRewrite = async () => { 
                if(!rewriteInput.trim()) return;
                setIsRewriting(true); setRewriteResult(null);
                try {
                    await new Promise(r => setTimeout(r, 1000));
                    if(appMode === 'full') {
                        const sys = `華語編輯。輸出JSON: { "text": "...", "analysis": [{"type": "vocab", "text": "..."}], "tone": "..." }`;
                        const res = await callGeminiAPI(apiKey, `改寫任務:${rewriteMode}, 文本:${rewriteInput}`, sys, true);
                        setRewriteResult(res);
                    } else {
                        setRewriteResult({ text: `(模擬改寫) ${rewriteInput}`, analysis: [{type: 'grammar', text: '模擬分析...'}], tone: '模擬語氣' });
                    }
                } catch(e) {} finally { setIsRewriting(false); }
            };

            const handleQASend = async (text = qaInput) => {
                if (!text.trim()) return;
                const newMsgs = [...qaMessages, { role: 'user', type: 'text', text }];
                setQaMessages(newMsgs);
                setQaInput('');
                setIsQAing(true);

                try {
                    await new Promise(r => setTimeout(r, 1000));
                    if (appMode === 'trial') {
                        let mockRes = MOCK_QA_DB['default'];
                        for (const key in MOCK_QA_DB) {
                            if (selectedTheme.name.includes(key) || text.includes(key)) mockRes = MOCK_QA_DB[key];
                        }
                        setQaMessages(prev => [...prev, { role: 'ai', type: 'rich', data: mockRes }]);
                    } else {
                        const sys = `華語文化導師。輸出JSON: { "answer": "...", "culture_note": "...", "vocabulary": [{ "word": "...", "pinyin": "..." }] }`;
                        const usr = `情境：${selectedTheme.name}-${selectedScenario}。問題：${text}`;
                        const res = await callGeminiAPI(apiKey, usr, sys, true);
                        setQaMessages(prev => [...prev, { role: 'ai', type: 'rich', data: res }]);
                    }
                } catch (e) {
                    setQaMessages(prev => [...prev, { role: 'ai', type: 'text', text: "抱歉，無法處理請求。" }]);
                } finally { setIsQAing(false); }
            };

            const handleChatSend = async () => {
                if (!chatInput.trim()) return;
                const newMsgs = [...chatMessages, { role: 'user', text: chatInput }];
                setChatMessages(newMsgs);
                setChatInput('');
                setIsChatting(true);

                try {
                    await new Promise(r => setTimeout(r, 800));
                    if (appMode === 'trial') {
                        const responses = MOCK_CHAT_DB[selectedAssistant.id];
                        const randomRes = getRandom(responses);
                        setChatMessages(prev => [...prev, { role: 'ai', text: randomRes }]);
                    } else {
                        const sys = `${selectedAssistant.prompt_persona} 請保持簡短。`;
                        const historyPrompt = newMsgs.map(m => `${m.role==='user'?'學生':'老師'}: ${m.text}`).join('\n') + "\n老師:";
                        const res = await callGeminiAPI(apiKey, historyPrompt, sys, false);
                        setChatMessages(prev => [...prev, { role: 'ai', text: res }]);
                    }
                } catch (e) {
                    setChatMessages(prev => [...prev, { role: 'ai', text: "(連線錯誤)" }]);
                } finally { setIsChatting(false); }
            };

            const handleMmGenerate = async () => {
                setIsMmGen(true); setMmData(null);
                try {
                    await new Promise(r => setTimeout(r, 1500));
                    if (appMode === 'trial') {
                        const res = generateMockMMScript(mmScenario.title, genLevel);
                        setMmData(res);
                    } else {
                        const sys = `編劇。輸出JSON: { "script": [ { "speaker": "A", "text": "..." } ], "visual_tags": [], "culture_note": "..." }`;
                        const usr = `情境「${mmScenario.title}」。等級${genLevel}。`;
                        const res = await callGeminiAPI(apiKey, usr, sys, true);
                        setMmData(res);
                    }
                } catch(e) { alert("生成失敗"); } finally { setIsMmGen(false); }
            };

            // --- Render Logic ---
            return (
                <div className="min-h-screen flex flex-col font-sans">
                    <ModeSelectionModal isOpen={isSettingsOpen} onClose={() => setIsSettingsOpen(false)} onSelectMode={handleModeSelect} currentKey={apiKey} />

                    {/* Navbar */}
                    <header className="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setActiveTab('generate')}>
                                <div className="w-9 h-9 bg-[#FFB347] rounded-lg flex items-center justify-center text-white font-bold text-xl shadow-sm">華</div>
                                <div className="flex flex-col">
                                    <span className="text-lg font-bold tracking-tight text-[#006699] leading-tight">華語AI百寶箱

{/* 回首頁按鈕 (React寫法) */}
<a href="index.html" className="flex items-center gap-2 mr-4 text-slate-600 hover:text-orange-500 font-bold no-underline">
    <span className="text-xl">🏠</span>
    <span className="hidden md:inline">回首頁</span>
</a>
</span>
                                    <div className="flex items-center gap-2">
                                        <span className="text-[10px] text-gray-400 font-medium tracking-wider">v6.3 Full Restoration</span>
                                        {appMode === 'trial' ? <span className="text-[10px] bg-emerald-100 text-emerald-700 px-1.5 rounded flex items-center gap-1"><Rocket size={10}/> 體驗版</span> : <span className="text-[10px] bg-blue-100 text-blue-700 px-1.5 rounded flex items-center gap-1"><Gem size={10}/> 正式版</span>}
                                    </div>
                                </div>
                            </div>
                            <nav className="hidden md:flex items-center gap-1">
                                {[{ id: 'generate', label: '文本生成', icon: PenTool }, { id: 'rewrite', label: '文本改寫', icon: RefreshCw }, { id: 'qa', label: '問答延伸', icon: MessageCircle }, { id: 'assistant', label: 'AI助教', icon: Bot }, { id: 'multimodal', label: '多模態', icon: Headphones }].map((item) => (
                                    <button key={item.id} onClick={() => setActiveTab(item.id)} className={`px-3 py-2 rounded-md flex items-center gap-2 text-sm font-medium transition-all ${activeTab === item.id ? 'bg-[#006699] text-white shadow-md scale-105' : 'text-gray-600 hover:bg-gray-100'}`}><item.icon size={16}/> {item.label}</button>
                                ))}
                            </nav>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setIsSettingsOpen(true)} className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border transition-colors ${appMode === 'full' ? 'bg-blue-50 text-blue-600 border-blue-200' : 'bg-emerald-50 text-emerald-600 border-emerald-200'}`}><Settings size={14}/> {appMode === 'full' ? '正式版設定' : '切換模式'}</button>
                            </div>
                        </div>
                    </header>

                    {/* Main Workspace */}
                    <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-6 relative z-0">
                        {/* Sidebar */}
                        <div className="lg:col-span-3 flex flex-col gap-4 animate-fade-in">
                            {activeTab === 'multimodal' ? (
                                <Card title="選擇情境 (Visual Context)" icon={Eye} className="h-full">
                                    <div className="grid grid-cols-2 gap-2">
                                        {MM_SCENARIOS.map(s => (
                                            <button 
                                                key={s.id} 
                                                onClick={() => { setMmScenario(s); setMmData(null); }} 
                                                className={`p-2 rounded-lg text-left flex flex-col items-center justify-center gap-1 transition-all ${mmScenario.id === s.id ? 'bg-[#FFF4E6] border-2 border-[#FFB347] shadow-sm' : 'bg-gray-50 hover:bg-gray-100 border-2 border-transparent'}`}
                                            >
                                                <span className="text-2xl">{s.icon}</span>
                                                <span className="text-xs font-bold text-gray-700">{s.title}</span>
                                            </button>
                                        ))}
                                    </div>
                                    <div className="mt-4 p-3 bg-blue-50 rounded-lg text-xs text-gray-600">
                                        <div className="font-bold text-[#006699] mb-1">情境說明：</div>
                                        {mmScenario.desc}
                                    </div>
                                </Card>
                            ) : activeTab === 'generate' || activeTab === 'qa' ? (
                                <>
                                    <Card title="選擇主題" icon={BookOpen} className="max-h-[40vh]">
                                        <div className="grid gap-1">
                                            {THEMES.map(t => <button key={t.id} onClick={() => setSelectedTheme(t)} className={`px-3 py-2 rounded-lg text-left flex items-center gap-2 ${selectedTheme.id === t.id ? 'bg-[#FFF4E6] text-[#b37400] font-bold border-l-4 border-[#FFB347]' : 'hover:bg-gray-50'}`}><span>{t.icon}</span><span>{t.name}</span></button>)}
                                        </div>
                                    </Card>
                                    <Card className="flex-1">
                                        <div className="mb-2 text-xs font-bold text-gray-400">目前主題：{selectedTheme.name}</div>
                                        <div className="grid gap-1">{selectedTheme.scenarios.map((s, i) => <button key={i} onClick={() => setSelectedScenario(s)} className={`px-3 py-2 rounded text-left text-sm ${selectedScenario === s ? 'bg-[#006699] text-white' : 'hover:bg-gray-50'}`}>{s}</button>)}</div>
                                    </Card>
                                </>
                            ) : activeTab === 'rewrite' ? (
                                <Card title="改寫歷史" icon={RefreshCw} className="h-full"><div className="text-sm text-gray-500 text-center py-4">改寫紀錄將顯示於此</div></Card>
                            ) : (
                                <Card title="選擇助教" icon={Bot} className="h-full">
                                    <div className="space-y-3">
                                        {ASSISTANTS.map(ast => (
                                            <button key={ast.id} onClick={() => setSelectedAssistant(ast)} className={`w-full p-3 rounded-xl border-2 text-left transition-all ${selectedAssistant.id === ast.id ? `border-current ${ast.color.split(' ')[0]}` : 'border-gray-100 hover:border-gray-200'}`}>
                                                <div className="text-2xl mb-1">{ast.avatar}</div>
                                                <div className="font-bold text-gray-800">{ast.name}</div>
                                                <div className="text-xs text-gray-500">{ast.style}</div>
                                            </button>
                                        ))}
                                    </div>
                                </Card>
                            )}
                        </div>

                        {/* Content Area */}
                        <div className="lg:col-span-9 flex flex-col gap-6 animate-fade-in" style={{animationDelay: '0.1s'}}>
                            
                            {/* --- 1. Generate View --- */}
                            {activeTab === 'generate' && (
                                <Card className="h-full border-[#FFB347]/20 border relative">
                                    <div className="flex justify-between items-center mb-6 border-b border-gray-100 pb-4">
                                        <div><h2 className="text-xl font-bold text-gray-800 flex items-center gap-2"><Zap className="text-[#FFB347]" size={20}/> 智能文本生成</h2><div className="text-sm text-gray-500 mt-1 flex items-center gap-1">{selectedTheme.name} <ChevronRight size={12}/> {selectedScenario}</div></div>
                                        <div className="flex gap-1 bg-gray-100 p-1 rounded-lg">{LEVELS.map(l => <button key={l} onClick={() => setGenLevel(l)} className={`px-3 py-1 rounded text-sm font-bold ${genLevel === l ? 'bg-white text-[#006699] shadow-sm' : 'text-gray-400'}`}>{l}</button>)}</div>
                                    </div>
                                    <div className="grid grid-cols-4 gap-3 mb-6">{PATTERNS.map(p => <div key={p.id} onClick={() => setGenPattern(p.id)} className={`p-3 rounded-lg border cursor-pointer ${genPattern === p.id ? 'border-[#FFB347] bg-[#FFF9F2]' : 'border-gray-100'}`}><div className="font-bold text-sm">{p.name}</div><div className="text-xs text-gray-500">{p.desc}</div></div>)}</div>
                                    <div className="flex justify-end gap-3 mb-4"><Button variant="ghost" onClick={() => setGenResult(null)}>清除</Button><Button onClick={handleGenerate} disabled={isGenerating} className="w-48" variant={appMode === 'trial' ? 'trial' : 'primary'}>{isGenerating ? <><Loader2 className="animate-spin mr-2" size={16}/> 生成中...</> : appMode === 'trial' ? '🚀 體驗版生成' : '✨ AI 智能生成'}</Button></div>
                                    <div className="bg-gray-50 rounded-xl p-6 flex-1 overflow-auto border border-gray-200 min-h-[300px]">
                                        {genResult ? <div className="space-y-4 animate-fade-in">{genResult.content.map((item, idx) => <div key={idx} className="bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:border-[#FFB347] group"><div className="flex justify-between mb-2"><span className="text-[10px] bg-orange-50 text-[#b37400] px-2 py-0.5 rounded font-bold">{item.type}</span><div className="flex gap-2 opacity-60 hover:opacity-100 transition-opacity"><button className="text-gray-400 hover:text-[#006699]" onClick={() => {setRewriteInput(item.text); setActiveTab('rewrite');}}><RefreshCw size={14}/></button></div></div><div className="text-lg font-medium text-gray-800 mb-1">{item.text}</div><div className="text-sm text-gray-400 font-mono mb-2">{item.pinyin}</div><div className="inline-flex items-center gap-1 text-xs text-[#006699] bg-blue-50 px-2 py-1 rounded"><Zap size={10}/> {item.grammar_point}</div></div>)}</div> : <div className="h-full flex flex-col items-center justify-center text-gray-400"><Bot size={48} className="mb-2 opacity-20"/><p>請選擇設定並開始生成 ({appMode === 'trial' ? 'Deep Mock Engine' : 'Gemini Engine'})</p></div>}
                                    </div>
                                </Card>
                            )}

                            {/* --- 2. Rewrite View --- */}
                            {activeTab === 'rewrite' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 h-full">
                                    <Card title="原始文本輸入" icon={FileText} className="h-full">
                                        <div className="flex flex-col h-full gap-4"><textarea className="w-full flex-1 p-4 bg-gray-50 rounded-lg border-none resize-none focus:ring-2 focus:ring-[#006699]" placeholder="輸入文字..." value={rewriteInput} onChange={e => setRewriteInput(e.target.value)}/><Button onClick={handleRewrite} disabled={isRewriting} variant={appMode==='trial'?'trial':'primary'}>{isRewriting ? '處理中...' : '開始改寫'}</Button></div>
                                    </Card>
                                    <Card title="AI 改寫分析" icon={Sparkles} className="h-full border-[#FFB347]/30">
                                        <div className="h-full relative">{rewriteResult ? <div className="bg-[#FFF9F2] p-5 rounded-xl border border-[#FFB347]/20 shadow-sm animate-fade-in"><div className="font-bold text-[#b37400] mb-2 flex items-center gap-1"><Star size={12} fill="currentColor"/> 改寫結果 ({rewriteResult.tone})</div><div className="text-xl font-bold text-gray-800 leading-relaxed">{rewriteResult.text}</div></div> : <div className="h-full flex flex-col items-center justify-center text-gray-300"><ArrowRight size={48} className="mb-4 opacity-20"/><p>等待輸入...</p></div>}</div>
                                    </Card>
                                </div>
                            )}

                            {/* --- 3. QA View --- */}
                            {activeTab === 'qa' && (
                                <Card title={`問答助手：${selectedTheme.name}`} icon={MessageCircle} className="h-full relative bg-gray-50/50" noPadding>
                                    <div className="flex-1 p-4 overflow-y-auto space-y-6">
                                        {qaMessages.map((msg, i) => (
                                            <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                                {msg.role === 'ai' && <div className="w-8 h-8 rounded-full bg-[#FFB347] flex items-center justify-center text-white mr-2 mt-1 shadow-sm"><Bot size={16}/></div>}
                                                <div className={`max-w-[85%] ${msg.role === 'user' ? 'ml-auto' : ''}`}>
                                                    {msg.type === 'text' ? <div className={`p-4 rounded-2xl shadow-sm text-sm ${msg.role === 'user' ? 'bg-[#006699] text-white rounded-br-none' : 'bg-white text-gray-700 border border-gray-200 rounded-bl-none'}`}>{msg.text}</div> : 
                                                    <div className="bg-white rounded-2xl rounded-bl-none border border-gray-200 shadow-md overflow-hidden animate-fade-in"><div className="bg-[#FFF9F2] p-4 border-b border-[#FFB347]/10"><h4 className="font-bold text-gray-800 mb-2 flex items-center gap-2"><CheckCircle2 size={16} className="text-green-500"/> 回答</h4><p className="text-gray-700 text-sm leading-relaxed">{msg.data.answer}</p></div><div className="p-4 grid gap-4"><div><h5 className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1"><Globe size={12}/> 文化小補帖</h5><div className="bg-gray-50 p-3 rounded-lg text-sm text-gray-600 border border-gray-100">{msg.data.culture_note}</div></div></div></div>}
                                                </div>
                                            </div>
                                        ))}
                                        {isQAing && <div className="flex justify-start"><div className="bg-gray-100 p-3 rounded-2xl text-gray-400 text-sm animate-pulse">Thinking...</div></div>}
                                    </div>
                                    <div className="p-4 bg-white border-t border-gray-100 flex gap-2"><input type="text" value={qaInput} onChange={(e) => setQaInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleQASend()} placeholder="輸入問題..." className="flex-1 border border-gray-300 rounded-full px-4 py-2 focus:outline-none focus:border-[#006699] focus:ring-1 focus:ring-[#006699] shadow-inner"/><Button onClick={() => handleQASend()} disabled={isQAing} className="rounded-full w-10 h-10 p-0 shadow-lg"><Send size={18}/></Button></div>
                                </Card>
                            )}

                            {/* --- 4. Assistant View --- */}
                            {activeTab === 'assistant' && (
                                <Card className={`h-full border-t-4 ${selectedAssistant.id==='wang' ? 'border-blue-500' : 'border-orange-500'}`} noPadding>
                                    <div className="bg-white p-4 border-b border-gray-100 flex items-center gap-3">
                                        <div className={`w-12 h-12 rounded-full flex items-center justify-center text-2xl border-2 border-white shadow-sm ${selectedAssistant.color}`}>{selectedAssistant.avatar}</div>
                                        <div><div className="font-bold text-gray-800">{selectedAssistant.name}</div><div className="text-xs text-gray-500">{selectedAssistant.style}</div></div>
                                    </div>
                                    <div className="flex-1 p-6 overflow-y-auto space-y-6 bg-[#f8f9fa]">
                                        {chatMessages.map((msg, i) => (
                                            <div key={i} className={`flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : ''}`}>
                                                {msg.role === 'ai' && <div className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-sm">{selectedAssistant.avatar}</div>}
                                                <div className={`max-w-[70%] p-3.5 rounded-2xl text-sm leading-relaxed shadow-sm ${msg.role === 'user' ? 'bg-gray-800 text-white' : 'bg-white text-gray-700 border border-gray-200'}`}>{msg.text}</div>
                                            </div>
                                        ))}
                                        {isChatting && <div className="flex gap-3"><div className="w-8 h-8 rounded-full bg-gray-200"/><div className="bg-gray-100 p-3 rounded-2xl text-xs text-gray-400">Typing...</div></div>}
                                    </div>
                                    <div className="p-4 bg-white border-t border-gray-200 relative"><input type="text" value={chatInput} onChange={(e) => setChatInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleChatSend()} placeholder={`傳送訊息給${selectedAssistant.name}...`} className="w-full bg-gray-100 rounded-xl px-4 py-3 pr-12 focus:outline-none focus:bg-white focus:ring-2 focus:ring-[#006699] transition-all"/><button onClick={handleChatSend} disabled={isChatting} className="absolute right-6 top-6 p-1.5 text-gray-400 hover:text-[#006699]"><Send size={20}/></button></div>
                                </Card>
                            )}

                            {/* --- 5. Multimodal View --- */}
                            {activeTab === 'multimodal' && (
                                <div className="grid grid-cols-12 gap-6 h-full">
                                    <div className="col-span-8 flex flex-col gap-6">
                                        <Card className="flex-1 bg-black text-white relative flex items-center justify-center overflow-hidden group border-0 shadow-xl">
                                            <img key={mmScenario.id} src={`https://source.unsplash.com/800x600/?${mmScenario.keyword},taiwan`} alt="Context" className="absolute inset-0 w-full h-full object-cover opacity-70 animate-ken-burns transition-opacity duration-1000"/>
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"/>
                                            <div className="z-20 text-center px-8 relative">
                                                <div className="inline-block p-4 rounded-full bg-white/10 backdrop-blur-md mb-4 border border-white/20 text-4xl shadow-lg animate-fade-in">{mmScenario.icon}</div>
                                                <h2 className="text-4xl font-bold mb-2 text-white drop-shadow-md tracking-wide">{mmScenario.title}</h2>
                                                <p className="text-gray-200 text-lg mb-8 font-light">{mmScenario.prompt}</p>
                                                {!mmData ? <Button onClick={handleMmGenerate} disabled={isMmGen} className="mx-auto bg-[#FFB347] hover:bg-[#ff9f1a] text-gray-900 border-0 shadow-[0_0_20px_rgba(255,179,71,0.5)] transition-all hover:scale-105 px-8 py-3 text-lg font-bold">{isMmGen ? <><Loader2 className="animate-spin mr-2"/> 分析情境中...</> : <><Camera className="mr-2" size={20}/> 拍攝情境 & 生成教材</>}</Button> : <div className="animate-fade-in flex gap-3 justify-center"><Button onClick={() => setMmData(null)} className="bg-white/20 hover:bg-white/30 text-white border-white/50 backdrop-blur-md">重新拍攝</Button></div>}
                                            </div>
                                        </Card>
                                        <Card title={mmData ? "AI 生成學習內容 (Generated Content)" : "等待生成..."} icon={FileText} className="h-1/2 overflow-hidden">
                                            {mmData ? (
                                                <div className="h-full flex flex-col animate-fade-in">
                                                    <div className="flex gap-2 mb-4 overflow-x-auto p-1">{mmData.visual_tags?.map((tag, i) => <span key={i} className="text-xs bg-blue-50 text-[#006699] px-2 py-1 rounded-full border border-blue-100 flex items-center gap-1 whitespace-nowrap"><Eye size={10}/> {tag}</span>)}</div>
                                                    <div className="flex-1 overflow-y-auto space-y-4 pr-2">{mmData.script.map((line, i) => <div key={i} className="flex gap-4 p-3 rounded-lg hover:bg-gray-50 transition-colors"><div className={`font-bold w-12 shrink-0 text-right ${line.speaker.includes('我') || line.speaker==='A' ? 'text-[#006699]' : 'text-[#FFB347]'}`}>{line.speaker}</div><div className="text-gray-700 text-lg leading-relaxed">{line.text}</div></div>)}</div>
                                                    {mmData.culture_note && <div className="mt-4 p-3 bg-[#FFF4E6] rounded-lg border border-[#FFB347]/30 text-sm text-[#b37400] flex gap-2"><Lightbulb size={16} className="shrink-0 mt-0.5"/><div>{mmData.culture_note}</div></div>}
                                                </div>
                                            ) : <div className="h-full flex flex-col items-center justify-center text-gray-300"><ImageIcon size={48} className="mb-4 opacity-20"/><p>點擊上方按鈕，AI 將為您生成情境對話</p></div>}
                                        </Card>
                                    </div>
                                    <div className="col-span-4 flex flex-col gap-4">
                                        <Card title="難度設定" icon={Settings}>
                                            <div className="flex gap-2 flex-wrap">{LEVELS.map(l => <button key={l} onClick={() => setGenLevel(l)} className={`flex-1 py-1.5 px-2 rounded text-sm font-bold border transition-all ${genLevel === l ? 'bg-[#006699] text-white border-[#006699]' : 'bg-white text-gray-500 border-gray-200 hover:border-gray-400'}`}>{l}</button>)}</div>
                                        </Card>
                                        <Card title="情境設置" icon={Sliders} className="flex-1">
                                            <div className="space-y-4">
                                                <div><label className="text-xs font-bold text-gray-500 mb-2 block uppercase tracking-wider">顯示模式</label><div className="flex bg-gray-100 p-1 rounded-lg"><button className="flex-1 py-1.5 rounded-md text-xs font-bold bg-white text-gray-800 shadow-sm">圖文並茂</button><button className="flex-1 py-1.5 rounded-md text-xs font-bold text-gray-500 hover:text-gray-700">純聽力</button></div></div>
                                                <div className="pt-4 border-t border-gray-100"><label className="text-xs font-bold text-gray-500 mb-2 block uppercase tracking-wider">語速</label><input type="range" min="0.5" max="1.5" step="0.1" defaultValue="1" className="w-full accent-[#006699] h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"/><div className="flex justify-between text-[10px] text-gray-400 mt-1"><span>0.5x</span><span>Normal</span><span>1.5x</span></div></div>
                                                <div className="pt-4 border-t border-gray-100 space-y-2"><Button variant="outline" className="w-full justify-start" disabled={!mmData}><Volume2 size={16} className="mr-2"/> 播放完整對話</Button><Button variant="outline" className="w-full justify-start" disabled={!mmData}><Mic size={16} className="mr-2"/> 跟讀練習 (錄音)</Button></div>
                                            </div>
                                        </Card>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<HuaYuAIApp />);
    </script>
</body>
</html>
